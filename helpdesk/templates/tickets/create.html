{% extends "base.html" %}

{% block title %}New Ticket{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-8">
    <h1 class="h3 mb-4">Submit a ticket</h1>
    <form method="post" novalidate class="card card-body shadow-sm">
      <div class="mb-3">
        <label for="title" class="form-label">Title</label>
        <input type="text" class="form-control" id="title" name="title" maxlength="100"
               placeholder="e.g. Printer on 2nd floor won't print"
               value="{{ request.form['title'] }}" required autofocus>
      </div>
      <div class="mb-3">
        <label for="description" class="form-label">Description</label>
        <textarea class="form-control" id="description" name="description" rows="6" maxlength="2000"
                  placeholder="What happened? What have you tried?" required>{{ request.form['description'] }}</textarea>
      </div>
      <div class="mb-4">
        <label for="priority" class="form-label">Priority</label>
        <select class="form-select" id="priority" name="priority">
          {% set chosen = request.form.get('priority', 'Medium') %}
          {% for p in priorities %}
            <option value="{{ p }}" {% if p == chosen %}selected{% endif %}>{{ p }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary">Submit Ticket</button>
        <a href="{{ url_for('tickets.index') }}" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
